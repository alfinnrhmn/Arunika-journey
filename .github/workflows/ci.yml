name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Izin minimum: CI hanya membaca kode.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipe, tes, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Action dikunci ke commit SHA (bukan tag) agar tidak bisa dibajak lewat tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` memasang persis sesuai lockfile; .npmrc mematikan skrip instalasi.
      - run: npm ci

      - name: Verifikasi tanda tangan registry
        run: npm audit signatures

      - name: Audit dependensi produksi (gagal bila ada temuan high ke atas)
        run: npm audit --omit=dev --audit-level=high

      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
