# Lingkungan lokal: hanya Postgres. App dijalankan lewat `npm run dev`.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: arunika
      POSTGRES_PASSWORD: arunika
      POSTGRES_DB: arunika
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arunika']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
